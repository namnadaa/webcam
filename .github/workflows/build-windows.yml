name: Build Windows

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Restore OpenCV cache
        id: opencv-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\opencv\build\install
          key: opencv-4.12.0-mingw-noqt-v2

      - name: Checkout OpenCV 4.12.0
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: opencv/opencv
          ref: 4.12.0
          path: opencv-src
          fetch-depth: 1

      - name: Checkout OpenCV contrib 4.12.0
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: opencv/opencv_contrib
          ref: 4.12.0
          path: opencv-contrib-src
          fetch-depth: 1

      - name: Set up MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Build OpenCV 4.12.0 (no Qt, no FFmpeg)
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          cmake -S opencv-src -B opencv-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=C:/opencv/build/install \
            -DOPENCV_EXTRA_MODULES_PATH="$PWD/opencv-contrib-src/modules" \
            -DBUILD_LIST=core,flann,imgproc,imgcodecs,videoio,highgui,objdetect,features2d,video,dnn,calib3d,photo,face,xfeatures2d,plot,tracking,img_hash,bgsegm,aruco,wechat_qrcode,ximgproc \
            -DBUILD_SHARED_LIBS=ON \
            -DOPENCV_ENABLE_NONFREE=ON \
            -DWITH_QT=OFF \
            -DWITH_FFMPEG=OFF \
            -DWITH_OPENCL=OFF \
            -DWITH_IPP=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_DOCS=OFF \
            -DBUILD_opencv_apps=OFF
          cmake --build opencv-build
          cmake --install opencv-build

      # Save right after the build so a later failure does not throw away
      # 30+ minutes of OpenCV compilation.
      - name: Save OpenCV cache
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\opencv\build\install
          key: opencv-4.12.0-mingw-noqt-v2

      - name: Build
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
          CC: gcc
          CXX: g++
        run: |
          # gocv's own LDFLAGS do not list flann, but features2d needs it
          export CGO_LDFLAGS="-LC:/opencv/build/install/x64/mingw/lib -lopencv_flann4120"
          mkdir -p build
          go build -o build/webcam.exe ./cmd/cam

      - name: Copy required DLLs
        shell: msys2 {0}
        run: |
          export PATH="/c/opencv/build/install/x64/mingw/bin:$PATH"
          cp /c/opencv/build/install/x64/mingw/bin/libopencv_*.dll build/

          copied=1
          while [ "$copied" -eq 1 ]; do
            copied=0
            for f in build/webcam.exe build/*.dll; do
              for dep in $(ldd "$f" 2>/dev/null | awk '/\/mingw64\//{print $3}'); do
                base=$(basename "$dep")
                if [ ! -f "build/$base" ]; then
                  cp "$dep" build/
                  copied=1
                fi
              done
            done
          done

          echo "=== unresolved dependencies (must be empty) ==="
          # grep exits with 1 when it finds nothing; under bash -e -o pipefail that
          # would kill the step even though nothing is missing, so tolerate it.
          missing=$(for f in build/webcam.exe build/*.dll; do ldd "$f" 2>/dev/null | grep -i "not found" || true; done)
          if [ -n "$missing" ]; then
            echo "$missing"
            exit 1
          fi
          echo "none - all dependencies resolved"

          ls -la build/

      # The Markdown docs stay in the repository for GitHub; the package gets
      # self-contained HTML that opens in any browser without internet access.
      - name: Build documentation (HTML)
        shell: bash
        run: |
          choco install pandoc -y --no-progress
          export PATH="$PATH:/c/Program Files/Pandoc"
          pandoc --version | head -1

          # links between the documents point to .md files; the parentheses keep
          # only the first value returned by gsub
          cat > links.lua <<'LUA'
          function Link(el)
            el.target = (el.target:gsub("%.md", ".html"))
            return el
          end
          LUA

          cat > style.html <<'CSS'
          <style>
            body { max-width: 52em; margin: 2em auto; padding: 0 1em; font-family: "Segoe UI", Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #222; }
            table { border-collapse: collapse; margin: 1em 0; }
            th, td { border: 1px solid #bbb; padding: 0.3em 0.6em; text-align: left; vertical-align: top; }
            th { background: #f0f0f0; }
            code, pre { background: #f2f2f2; border-radius: 3px; font-family: Consolas, "Courier New", monospace; }
            code { padding: 0.1em 0.3em; }
            pre { padding: 0.8em; overflow-x: auto; }
            pre code { padding: 0; }
            a { color: #0b5cad; }
          </style>
          CSS

          find docs -name '*.md' | while read -r src; do
            out="build/${src%.md}.html"
            mkdir -p "$(dirname "$out")"
            pandoc "$src" -f gfm -t html5 -s --embed-resources \
              --lua-filter=links.lua -H style.html \
              --metadata pagetitle="$(basename "$src" .md)" \
              -o "$out"
          done

          ls -R build/docs

      - name: Add README.txt
        shell: bash
        run: |
          # UTF-8 with BOM and CRLF, so Windows Notepad shows Cyrillic correctly
          {
            printf '\xEF\xBB\xBF'
            sed 's/$/\r/' <<'TXT'
          Запуск: webcam.exe
          Документация в папке docs, начните с docs\ru\guide.html (откройте в браузере).

          Run: webcam.exe
          Documentation is in the docs folder, start with docs\en\guide.html (open it in a browser).
          TXT
          } > build/README.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webcam-windows-x64
          path: build/
          retention-days: 30