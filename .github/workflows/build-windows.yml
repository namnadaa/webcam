name: Build Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up MSYS2 with OpenCV
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-opencv
            mingw-w64-x86_64-pkg-config

      - name: Build
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: |
          MINGW=$(cygpath -m /mingw64)
          export PKG_CONFIG_PATH="${MINGW}/lib/pkgconfig"
          export CGO_CFLAGS="-I${MINGW}/include/opencv4"
          export CGO_CXXFLAGS="-I${MINGW}/include/opencv4"
          export CGO_LDFLAGS="-L${MINGW}/lib"
          mkdir -p /c/opencv/build/install/include
          ln -sfn /mingw64/include/opencv4/opencv2 /c/opencv/build/install/include/opencv2
          # gocv on Windows expects versioned names (libopencv_core4120.dll.a)
          # MSYS2 uses unversioned names (libopencv_core.dll.a)
          for f in /mingw64/lib/libopencv_*.dll.a; do
            name="${f%.dll.a}"
            ln -sf "$f" "${name}4120.dll.a"
          done

          mkdir -p build
          go build -o build/webcam.exe ./cmd/cam

      - name: Copy required DLLs
        shell: msys2 {0}
        run: |
          mkdir -p build/platforms
          copied=1
          while [ "$copied" -eq 1 ]; do
            copied=0
            for f in build/webcam.exe build/*.dll; do
              [ -f "$f" ] || continue
              for dep in $(ldd "$f" 2>/dev/null | awk '/\/mingw64\//{print $3}'); do
                base=$(basename "$dep")
                if [ ! -f "build/$base" ]; then
                  cp -n "$dep" build/
                  copied=1
                fi
              done
            done
          done
          cp /mingw64/share/qt6/plugins/platforms/qwindows.dll build/platforms/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webcam-windows-x64
          path: build/
          retention-days: 30
