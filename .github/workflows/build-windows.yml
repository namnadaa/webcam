name: Build Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up MSYS2 with OpenCV
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-opencv
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-5compat

      - name: Sanity check OpenCV install
        shell: msys2 {0}
        run: |
          set +e
          pacman -Q mingw-w64-ucrt-x86_64-opencv
          find /ucrt64/include -iname "opencv.hpp" 2>&1
          set -e

      - name: Pin OpenCV to 4.13 (avoid breaking OpenCV 5 upgrade)
        shell: msys2 {0}
        run: |
          pacman -U --noconfirm \
            https://mirror.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-opencv-4.13.0-2-any.pkg.tar.zst
            
      - name: Build
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: |
          UCRT=$(cygpath -m /ucrt64)
          export PKG_CONFIG_PATH="${UCRT}/lib/pkgconfig"
          export CGO_CFLAGS="-I${UCRT}/include/opencv4"
          export CGO_CXXFLAGS="-I${UCRT}/include/opencv4"
          export CGO_LDFLAGS="-L${UCRT}/lib"

          mkdir -p /c/opencv/build/install/include
          cp -r /ucrt64/include/opencv4/opencv2 /c/opencv/build/install/include/opencv2

          for f in /ucrt64/lib/libopencv_*.dll.a; do
            name="${f%.dll.a}"
            ln -sf "$f" "${name}4130.dll.a"
          done

          mkdir -p build
          go build -o build/webcam.exe ./cmd/cam

      - name: Copy required DLLs
        shell: msys2 {0}
        run: |
          mkdir -p build/platforms
          copied=1
          while [ "$copied" -eq 1 ]; do
            copied=0
            for f in build/webcam.exe build/*.dll; do
              [ -f "$f" ] || continue
              for dep in $(ldd "$f" 2>/dev/null | awk '/\/ucrt64\//{print $3}'); do
                base=$(basename "$dep")
                if [ ! -f "build/$base" ]; then
                  cp -n "$dep" build/
                  copied=1
                fi
              done
            done
          done
          cp /ucrt64/share/qt6/plugins/platforms/qwindows.dll build/platforms/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webcam-windows-x64
          path: build/
          retention-days: 30