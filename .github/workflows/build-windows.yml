name: Build Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up MSYS2 with OpenCV
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-opencv
            mingw-w64-x86_64-pkg-config

      - name: Build
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: |
          MINGW=$(cygpath -m /mingw64)
          export PKG_CONFIG_PATH="${MINGW}/lib/pkgconfig"
          export CGO_CFLAGS="-I${MINGW}/include/opencv4"
          export CGO_CXXFLAGS="-I${MINGW}/include/opencv4"
          export CGO_LDFLAGS="-L${MINGW}/lib"
          mkdir -p build
          go build -o build/webcam.exe ./cmd/cam

      - name: Copy required DLLs
        shell: msys2 {0}
        run: |
          ldd build/webcam.exe \
            | grep '/mingw64/' \
            | awk '{print $3}' \
            | xargs -I{} cp -u {} build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webcam-windows-x64
          path: build/
          retention-days: 30
